<h1 style="color: white;">DONNI OK</h1>

<script>
// ==================== CONFIGURATION SYSTÈME ====================
const SYS = `
Tu es DONNI, IA malienne.
Sois chaleureux et commence souvent par une salutation bambara.
Réponds en français, bambara ou fulfulde selon la langue détectée.
Tu connais les sujets Mali : NINA, passeport, santé, agriculture, éducation, orientation, entrepreneuriat.
Respect des règles de sécurité.
Réponds clairement en moins de 300 mots.
`;

// ==================== VARIABLES GLOBALES ====================
let chargement = false;
let recognition = null;
let isListening = false;

// ==================== SÉLECTION DES ÉLÉMENTS ====================
const inp = document.getElementById('inp');
const boutonEnvoi = document.getElementById('sendBtn');
const boutonMicro = document.getElementById('microBtn');
const microHint = document.getElementById('michHint');
const voiceWave = document.getElementById('voiceWave');
const ttsBar = document.getElementById('ttsBar');
const chat = document.getElementById('chat');

// ==================== INITIALISATION ====================
document.addEventListener("DOMContentLoaded", () => {
    inp.addEventListener('input', () => {
        boutonEnvoi.disabled = inp.value.trim() === '' || chargement;
    });

    inp.addEventListener('keydown', onKey);
});

// ==================== FONCTIONS UTILITAIRES ====================
function esc(t) {
    return t
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function scrollDown() {
    setTimeout(() => {
        chat.scrollTop = chat.scrollHeight;
    }, 60);
}

function detectLanguage(text) {
    const lower = text.toLowerCase();
    if (lower.includes("i ni") || lower.includes("bɛ")) {
        return 'bm';
    }
    return 'fr-FR';
}

function speakText(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();

    const clean = text.replace(/<[^>]+>/g, '').replace(/[*#_]/g, '');
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = detectLanguage(text);
    u.rate = 0.95;
    u.pitch = 1;

    ttsBar.classList.add('active');
    u.onend = () => ttsBar.classList.remove('active');
    window.speechSynthesis.speak(u);
}

function stopSpeech() {
    window.speechSynthesis.cancel();
    ttsBar.classList.remove('active');
}

function toggleMic() {
    isListening ? stopMic() : startMic();
}

function startMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        microHint.textContent = 'Utilise Chrome';
        return;
    }

    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = 'fr-FR';

    recognition.onstart = () => {
        isListening = true;
        boutonMicro.classList.add('listening');
        boutonMicro.textContent = '⏹';
        voiceWave.classList.add('active');
        stopSpeech();
    };

    recognition.onresult = (e) => {
        const t = Array.from(e.results)
            .map(r => r[0].transcript)
            .join('');
        inp.value = t;
        inp.dispatchEvent(new Event('input'));
    };

    recognition.onend = () => {
        isListening = false;
        boutonMicro.classList.remove('listening');
        boutonMicro.textContent = '🎤';
        voiceWave.classList.remove('active');

        if (inp.value.trim()) {
            setTimeout(() => send(), 300);
        }
    };

    recognition.start();
}

function stopMic() {
    if (recognition) recognition.stop();
}

function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
    }
}

// ==================== FONCTIONS PRINCIPALES ====================
async function send() {
    const texte = inp.value.trim();
    if (!texte || chargement) return;

    inp.value = '';
    boutonEnvoi.disabled = true;
    chargement = true;

    demander(texte);
}

async function demander(texte) {
    try {
        console.log("DONNI reçoit :", texte);
        
        // Simulation pour tester
        const reponse = "I ni ce ! N ye DONNI ye, n bɛ dɛmɛnaw kɛ Mali la. Mun bɛ sɔrɔ ?";

        // Afficher la réponse (à adapter selon ton HTML)
        // chat.innerHTML += `<div class="bot-message">${esc(reponse)}</div>`;
        
        speakText(reponse);
        scrollDown();

    } catch (e) {
        console.error(e);
    } finally {
        chargement = false;
        boutonEnvoi.disabled = false;
    }
}
</script>
